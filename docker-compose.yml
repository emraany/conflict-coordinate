services:
  db:
    image: postgis/postgis:16-3.4
    container_name: conflict_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: conflict
      POSTGRES_PASSWORD: conflict
      POSTGRES_DB: conflict
    ports:
      - "5432:5432"
    volumes:
      - conflict_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conflict -d conflict"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  conflict_pgdata:
