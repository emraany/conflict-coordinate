# Conflict registry — the hand-curated baseline of dots shown on the globe.
#
# Each entry produces ONE Conflict row in the DB. Auto-discovered conflicts
# (registry_source="wiki-auto") land in the same table with admin_curated
# left false; admin can promote/demote later.
#
# Fields:
#   slug              stable id; renaming = breaking
#   name              display name
#   conflict_type     free string — armed_conflict | civil_war | insurgency |
#                     asymmetric | civil_unrest | maritime_incident |
#                     humanitarian_emergency | diplomatic_crisis | …
#   status            active | frozen | resolved | emerging
#   primary_iso3      lead country (drives map fly-to)
#   secondary_iso3s   other countries the conflict spans
#   started_at        ISO date (YYYY-MM-DD)
#   summary           verbatim Wikipedia paragraph or admin-authored — neutral
#                     prose only, no LLM
#   wikipedia_url     canonical Wikipedia article
#   ucdp_conflict_id  optional UCDP cross-reference
#   parties:          list of {actor: <canon-slug>, role: party|mediator|observer|affected}
#   footprint:        list of {iso3: …, admin1: …}  -- admin1 in human form;
#                     loader normalizes to admin1_norm
#   routing:
#     actor_patterns: list of SQL-LIKE patterns matched against ACLED actor*
#                     fields. These take priority over admin1/country rules.
#     admin1_patterns: list of "<iso3>:<admin1_norm>" — overrides for cells
#                     not covered by `footprint` (rare).
#     country_patterns: list of ISO3 codes — fallback when nothing else matches.

conflicts:

  - slug: russo-ukrainian-war
    name: Russo-Ukrainian War
    conflict_type: interstate
    status: active
    primary_iso3: UKR
    secondary_iso3s: [RUS]
    started_at: "2014-02-20"
    wikipedia_url: https://en.wikipedia.org/wiki/Russo-Ukrainian_War
    ucdp_conflict_id: "11973"
    summary: >-
      An interstate conflict between Russia and Ukraine that began with the
      Russian annexation of Crimea in February 2014 and fighting in the
      Donbas, then escalated into a full-scale Russian invasion of Ukraine
      on 24 February 2022. Major frontlines have persisted across eastern
      and southern Ukraine.
    parties:
      - { actor: ru-state-forces, role: party }
      - { actor: ua-state-forces, role: party }
      - { actor: dpr-forces,      role: party }
      - { actor: lpr-forces,      role: party }
      - { actor: wagner-group,    role: party }
    footprint:
      - { iso3: UKR, admin1: Donetsk }
      - { iso3: UKR, admin1: Luhansk }
      - { iso3: UKR, admin1: Kharkiv }
      - { iso3: UKR, admin1: Kherson }
      - { iso3: UKR, admin1: Zaporizhia }
      - { iso3: UKR, admin1: Sumy }
      - { iso3: UKR, admin1: Crimea }
      - { iso3: UKR, admin1: Kyiv }
      - { iso3: UKR, admin1: Kyiv City }
      - { iso3: UKR, admin1: Mykolaiv }
      - { iso3: UKR, admin1: Odesa }
      - { iso3: UKR, admin1: Dnipropetrovsk }
      - { iso3: UKR, admin1: Chernihiv }
    routing:
      actor_patterns:
        - "Military Forces of Russia%"
        - "Military Forces of Ukraine%"
        - "Donetsk People's Republic%"
        - "Luhansk People's Republic%"
        # Wagner intentionally excluded — it appears in MLI/CAR/SDN events
