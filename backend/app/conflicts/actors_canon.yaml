# Canonical actor catalog. Each entry is one normalized party that may appear
# in one or more conflicts. The `aliases` list holds the verbatim ACLED /
# UCDP / GDELT string variants that should collapse to this canonical entry
# during event routing and actor-link normalization.
#
# Conventions:
#   - `slug` is stable; renaming is breaking. New canonical entries get new
#     slugs.
#   - `aliases` patterns are matched case-insensitively as SQL LIKE-style
#     wildcards (`%` and `_`). Plain strings without `%` match exactly.
#   - `type` ∈ {state, non_state, coalition, other}.
#   - `description` is verbatim Wikipedia or empty — enrichment fills it in.

